# Development only. The database has no published host port.
# Player/demo credentials are not created by this configuration.
services:
  workspace:
    image: mcr.microsoft.com/devcontainers/typescript-node:1-22-bookworm
    command: sleep infinity
    working_dir: /workspaces/knights-reforged
    volumes:
      - ..:/workspaces/knights-reforged:cached
    environment:
      NODE_ENV: development
      HOST: 0.0.0.0
      PORT: "3000"
      DATABASE_URL: postgres://knights:local_container_only@database:5432/knights
      TEST_DATABASE_URL: postgres://knights:local_container_only@database:5432/knights_test
      ALLOWED_TEST_DATABASE_HOST: database
    depends_on:
      database:
        condition: service_healthy
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: knights
      POSTGRES_PASSWORD: local_container_only
      POSTGRES_DB: knights
    volumes:
      - knights_cloud_dev_pg:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U knights -d knights"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  knights_cloud_dev_pg:
