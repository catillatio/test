services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: knights
      POSTGRES_PASSWORD: knights_local
      POSTGRES_DB: knights
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - knights_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U knights -d knights"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  knights_pg:
