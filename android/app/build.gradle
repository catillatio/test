plugins { id 'com.android.application' }

android {
    namespace 'game.kingdomcome.alpha'
    compileSdk 36
    buildToolsVersion '36.0.0'
    defaultConfig {
        applicationId 'game.kingdomcome.alpha'
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName '0.1.0-alpha.1'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    lint {
        abortOnError true
        warningsAsErrors true
        // Deliberate API-36 alpha: runner-installed newer SDKs must not change this target.
        // Keep NewApi and all security checks strict; suppress only freshness hints.
        disable 'AndroidGradlePluginVersion', 'OldTargetApi'
    }
}

dependencies { testImplementation 'junit:junit:4.13.2' }
