name: Approved synthetic image canary publication
on: create
permissions:
  contents: read
concurrency:
  group: kingdom-come-production
  cancel-in-progress: false
jobs:
  publish-synthetic-canary:
    # Explicit owner approval was supplied in this task. Only the first creation
    # of this temporary branch can run; no rerun, synchronize, game or Railway path.
    if: github.repository == 'catillatio/test' && github.actor == 'catillatio' && github.triggering_actor == 'catillatio' && github.event.ref_type == 'branch' && github.event.ref == 'canary/immutable-image-pull-20261027' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: read
      packages: write
    defaults:
      run:
        working-directory: knights-reforged/deployment/image-canary
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false, fetch-depth: 2, ref: '${{ github.sha }}'}
      - name: Compile only the owner-approved synthetic canary
        run: |
          python3 -m unittest discover -p 'test_publish.py'
          python3 prepare-local.py
          docker build --network none -t kingdom-come:isolated-digest-canary .
          docker pull node:24-bookworm-slim
          python3 test-local.py
      - name: Publish once privately and authenticate exact manifest and platform
        run: python3 publish.py
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: immutable-image-canary-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            knights-reforged/deployment/image-canary/publication-receipt.json
            knights-reforged/deployment/image-canary/local-build.json
            knights-reforged/deployment/image-canary/local-validation.json
          if-no-files-found: error
          retention-days: 14
