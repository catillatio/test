name: Railway authorization diagnostic
# Read-only and manual; the existing production owner approval remains required.
on:
  workflow_dispatch:
    inputs:
      image_target_inspection:
        description: 'Read-only first image handoff checks; never prepares or deploys a release'
        type: boolean
        default: false
      image_handoff_inspection:
        description: 'Read-only reconciliation of staged handoff 40629780333; never commits or deploys'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: ${{ (inputs.image_target_inspection || inputs.image_handoff_inspection) && 'kingdom-come-production' || 'kingdom-come-railway-authorization-diagnostic' }}
  cancel-in-progress: false
jobs:
  diagnostic:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/release/production'
    environment: production
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '24.22.0'}
      - name: Verify only Railway token scope and target metadata
        if: '!inputs.image_target_inspection && !inputs.image_handoff_inspection'
        env:
          # Direct bindings inside the approved job match the release's scopes;
          # no reusable-workflow secret forwarding or extra credential is needed.
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ vars.RAILWAY_PROJECT_ID }}
          RAILWAY_ENVIRONMENT_ID: ${{ vars.RAILWAY_ENVIRONMENT_ID }}
          RAILWAY_GAME_SERVICE_ID: ${{ vars.RAILWAY_GAME_SERVICE_ID }}
          RAILWAY_RELEASE_WORKER_SERVICE_ID: ${{ vars.RAILWAY_RELEASE_WORKER_SERVICE_ID }}
        run: bash knights-reforged/deployment/release/diagnose-railway.sh
      - name: Inspect exact first image handoff assertions without writes
        if: inputs.image_target_inspection && !inputs.image_handoff_inspection
        env:
          KINGDOM_IMAGE_TARGET_INSPECTION: 'true'
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ vars.RAILWAY_PROJECT_ID }}
          RAILWAY_ENVIRONMENT_ID: ${{ vars.RAILWAY_ENVIRONMENT_ID }}
          RAILWAY_GAME_SERVICE_ID: ${{ vars.RAILWAY_GAME_SERVICE_ID }}
        run: node knights-reforged/deployment/release/inspect-image-target.mjs
      - name: Inspect only the bound staged image handoff and signed evidence
        if: inputs.image_handoff_inspection && !inputs.image_target_inspection
        env:
          KINGDOM_IMAGE_HANDOFF_INSPECTION: 'true'
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          KINGDOM_IMAGE_REGISTRY_READ_TOKEN: ${{ secrets.KINGDOM_IMAGE_REGISTRY_READ_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ vars.RAILWAY_PROJECT_ID }}
          RAILWAY_ENVIRONMENT_ID: ${{ vars.RAILWAY_ENVIRONMENT_ID }}
          RAILWAY_GAME_SERVICE_ID: ${{ vars.RAILWAY_GAME_SERVICE_ID }}
          KINGDOM_RELEASE_VERIFY_KEY: ${{ vars.KINGDOM_RELEASE_VERIFY_KEY }}
        run: node knights-reforged/deployment/release/inspect-image-handoff.mjs
      - name: Reject ambiguous inspection modes without reading provider state
        if: inputs.image_target_inspection && inputs.image_handoff_inspection
        run: exit 1
