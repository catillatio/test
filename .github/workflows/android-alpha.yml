name: Kingdom Come Android alpha APK
on:
  pull_request:
    paths: ['android/**', '.github/workflows/android-alpha.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: kingdom-android-alpha-${{ github.ref }}
  cancel-in-progress: true
jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17.0.20.1+1'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          cmdline-tools-version: '16111833'
          packages: 'platforms;android-36 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: Test, lint and assemble without contacting the game
        run: ./gradlew --no-daemon --console=plain testDebugUnitTest lintDebug assembleDebug
      - name: Verify installable APK and publish checksum
        run: python3 scripts/verify-apk.py --apk app/build/outputs/apk/debug/app-debug.apk --tools "$ANDROID_HOME/build-tools/36.0.0"
      - name: Retain installable alpha APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kingdom-come-android-alpha-${{ github.run_id }}
          path: android/dist/
          if-no-files-found: error
          retention-days: 30
      - name: Retain Android test and lint reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kingdom-come-android-checks-${{ github.run_id }}
          path: |
            android/app/build/reports/tests/
            android/app/build/reports/lint-results-debug.*
          if-no-files-found: warn
          retention-days: 14
