name: Owner approved targeted operator
# Preparation only until separately reviewed, merged and explicitly enabled.
on:
  workflow_dispatch:
    inputs:
      operation:
        description: 'Review first. Apply needs a reviewed artifact and exact owner confirmation.'
        type: choice
        options: [review-name, review-gray, apply-name, apply-gray, verify-name, verify-gray, review-gray-restore, apply-gray-restore, verify-gray-restore, setup-audit]
        default: review-name
        required: true
      field:
        description: 'Name review only: auto detects one matching field; choose explicitly if both match.'
        type: choice
        options: [auto, account_username, character_name]
        default: auto
      message_id:
        description: 'Optional Gray-only exact broadcast UUID for read-only inspection.'
        type: string
      reverses_authorization_id:
        description: 'Gray restore review only: original audited hide authorization UUID.'
        type: string
      review_run_id:
        description: 'Apply/verify: successful owner-operator review run ID.'
        type: string
      review_artifact_id:
        description: 'Apply/verify: artifact ID from that review run.'
        type: string
      review_digest:
        description: 'Apply/verify: full SHA-256 from the decrypted owner review.'
        type: string
      confirmation:
        description: 'Apply: exact review phrase. Setup: exact schema-only confirmation.'
        type: string
permissions:
  contents: read
# Serialize with releases, without changing any release workflow or protocol.
concurrency:
  group: kingdom-come-production
  cancel-in-progress: false
jobs:
  safety:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/release/production'
    runs-on: ubuntu-24.04
    permissions: {contents: read, actions: read, deployments: read}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {ref: '${{ github.sha }}', persist-credentials: false}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '24.22.0'}
      - name: Check owner, protected environment, production branch and exact-commit CI
        env:
          GH_TOKEN: ${{ github.token }}
          KINGDOM_OPERATOR_ENABLED: ${{ vars.KINGDOM_OPERATOR_ENABLED }}
          KINGDOM_OPERATOR_OWNER: ${{ vars.KINGDOM_OPERATOR_OWNER }}
          KINGDOM_OPERATOR_RAILWAY_SCOPE_ACKNOWLEDGED: ${{ vars.KINGDOM_OPERATOR_RAILWAY_SCOPE_ACKNOWLEDGED }}
        run: node knights-reforged/deployment/operator/preflight.mjs
  operator:
    needs: safety
    environment: production
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions: {contents: read, actions: read, deployments: read}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {ref: '${{ github.sha }}', persist-credentials: false}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '24.22.0'}
      - name: Install checksum-pinned Railway CLI without exposing credentials
        run: |
          mkdir -p "$RUNNER_TEMP/owner-railway-cli"
          curl --fail --silent --show-error --location --output "$RUNNER_TEMP/owner-railway.tgz" https://github.com/railwayapp/cli/releases/download/v5.70.0/railway-v5.70.0-x86_64-unknown-linux-musl.tar.gz
          printf '%s  %s\n' f518230646acc7a6a7a67365e7642618f659d5d8cdd7cf8c180336140d0504eb "$RUNNER_TEMP/owner-railway.tgz" | sha256sum --check -
          tar --extract --gzip --file "$RUNNER_TEMP/owner-railway.tgz" --directory "$RUNNER_TEMP/owner-railway-cli" railway
          echo "$RUNNER_TEMP/owner-railway-cli" >> "$GITHUB_PATH"
      - name: Execute only the separately reviewed operator job
        env:
          GH_TOKEN: ${{ github.token }}
          KINGDOM_OPERATOR_ENABLED: ${{ vars.KINGDOM_OPERATOR_ENABLED }}
          KINGDOM_OPERATOR_OWNER: ${{ vars.KINGDOM_OPERATOR_OWNER }}
          KINGDOM_OPERATOR_RAILWAY_SCOPE_ACKNOWLEDGED: ${{ vars.KINGDOM_OPERATOR_RAILWAY_SCOPE_ACKNOWLEDGED }}
          RAILWAY_PROJECT_ID: ${{ vars.RAILWAY_PROJECT_ID }}
          RAILWAY_ENVIRONMENT_ID: ${{ vars.RAILWAY_ENVIRONMENT_ID }}
          RAILWAY_GAME_SERVICE_ID: ${{ vars.RAILWAY_GAME_SERVICE_ID }}
          RAILWAY_PG_SERVICE_ID: ${{ vars.RAILWAY_PG_SERVICE_ID }}
          RAILWAY_RELEASE_WORKER_SERVICE_ID: ${{ vars.RAILWAY_RELEASE_WORKER_SERVICE_ID }}
          RAILWAY_VERIFY_PG_SERVICE_ID: ${{ vars.RAILWAY_VERIFY_PG_SERVICE_ID }}
          RAILWAY_OPERATOR_BOOTSTRAP_SERVICE_ID: ${{ vars.RAILWAY_OPERATOR_BOOTSTRAP_SERVICE_ID }}
          RAILWAY_OPERATOR_SERVICE_ID: ${{ vars.RAILWAY_OPERATOR_SERVICE_ID }}
          KINGDOM_DATABASE_HOST: ${{ vars.KINGDOM_DATABASE_HOST }}
          KINGDOM_DATABASE_NAME: ${{ vars.KINGDOM_DATABASE_NAME }}
          KINGDOM_BACKUP_RECIPIENT: ${{ vars.KINGDOM_BACKUP_RECIPIENT }}
          KINGDOM_OPERATOR_VERIFY_KEY: ${{ vars.KINGDOM_OPERATOR_VERIFY_KEY }}
          KINGDOM_EXISTING_RELEASE_VERIFY_KEY: ${{ vars.KINGDOM_RELEASE_VERIFY_KEY }}
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          KINGDOM_OPERATOR_SIGNING_KEY: ${{ secrets.KINGDOM_OPERATOR_SIGNING_KEY }}
          OPERATOR_INPUT: ${{ inputs.operation }}
          OPERATOR_FIELD: ${{ inputs.field }}
          OPERATOR_MESSAGE_ID: ${{ inputs.message_id }}
          OPERATOR_REVERSES_AUTHORIZATION_ID: ${{ inputs.reverses_authorization_id }}
          OPERATOR_REVIEW_RUN_ID: ${{ inputs.review_run_id }}
          OPERATOR_REVIEW_ARTIFACT_ID: ${{ inputs.review_artifact_id }}
          OPERATOR_REVIEW_DIGEST: ${{ inputs.review_digest }}
          OPERATOR_CONFIRMATION: ${{ inputs.confirmation }}
        run: node knights-reforged/deployment/operator/controller.mjs
      - name: Retain encrypted review or outcome; never a recovery artifact
        id: operator-artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: owner-operator-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/kingdom-owner-operator/review.json
            ${{ runner.temp }}/kingdom-owner-operator/review.age
            ${{ runner.temp }}/kingdom-owner-operator/result.json
            ${{ runner.temp }}/kingdom-owner-operator/result.age
          if-no-files-found: error
          retention-days: 30
